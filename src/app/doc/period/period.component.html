<div class="container-fluid">
    <h1 class="text-center">{{ title }}</h1>

    <!-- Tabelle -->
    <div class="row" *ngIf="periods">
        <div class="table-responsive">
            <table class="table table-bordered table-dark table-striped table-hover">
                <thead class="text-center">
                    <tr>
                        <th score="col"><span>Periode</span></th>
                        <th score="col"><span>Ist aktiv?</span></th>
                        <th score="col"><span>Ist geschloßen?</span></th>
                        <th score="col"><span>Aktionen</span></th>
                    </tr>
                </thead>
                <tbody class="text-center">
                    <tr *ngFor="let period of periods">
                        <th score="row">
                            <a type="botton" [routerLink]="['/doc/periods/', period.prd, 'documents']"
                                class="btn table-link text-warning">
                                <span>{{ period.prd }}</span>
                            </a>
                        </th>
                        <td>
                            <i *ngIf="!period.act" class="bi bi-square" style="color: red"></i>
                            <i *ngIf="period.act" class="bi bi-check-square" style="color: green"></i>
                        </td>
                        <td>
                            <i *ngIf="!period.cls" class="bi bi-square" style="color: red"></i>
                            <i *ngIf="period.cls" class="bi bi-check-square" style="color: green"></i>
                        </td>
                        <td>
                            <a type="botton" (click)="onClickModalUpdate(period)" class="btn table-link text-info">
                                <i class="bi bi-pencil-square"></i>
                                <span> bearbeiten</span>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>


<!-- Upd Modal -->
<div class="modal fade" data-bs-theme="dark" data-bs-backdrop="static" id="updPeriodModal" tabindex="-1"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark text-light">
            <!-- Header -->
            <div class="modal-header">
                <h5 class="modal-title">Periode {{ updPeriod?.prd }} bearbeiten</h5>
                <button type="button" (click)="onClickCloseModal('updPeriodModal')" class="btn-close"
                    data-bs-dismiss="modal" aria-label="Schließen">
                </button>
            </div>

            <form #updForm="ngForm">
                <!-- Body -->
                <div class="modal-body" *ngIf="updPeriod">
                    <div class="form-check">
                        <input type="hidden" name="prd" [ngModel]="updPeriod.prd">
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="act" name="act" [(ngModel)]="updPeriod.act">
                        <label class="form-check-label" for="act">ist aktiv?</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="cls" name="cls" [(ngModel)]="updPeriod.cls">
                        <label class="form-check-label" for="cls">ist geschloßen?</label>
                    </div>
                </div>

                <!-- Footer -->
                <div class="modal-footer">
                    <button type="button" (click)="onClickCloseModal('updPeriodModal')" class="btn btn-secondary"
                        data-bs-dismiss="modal">
                        Schließen
                    </button>
                    <button (click)="handlePeriodSave(updForm.value)" type="button" class="btn btn-primary"
                        data-bs-dismiss="modal">
                        Speichern
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>
