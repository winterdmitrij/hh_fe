<form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="modal-body">

        <!-- Position ID -->
        <div class="mt-2">
            <small class="text-muted">
                Position: {{ form.value.id }}
            </small>
        </div>

        <!-- Dokument -->
        <div class="mt-2">
            <small class="text-muted">
                Dokument: {{ form.value.doc_id }}
            </small>
        </div>

        <!-- Konto -->
        <div class="mt-3">
            <label class="form-label">Konto</label>
            <select class="form-select" formControlName="acc_id">
                <option [ngValue]="null">-- wählen --</option>
                <option *ngFor="let acc of (accounts$ | async)" [ngValue]="acc.id">
                    {{ acc.dsg }}
                </option>
            </select>
        </div>

        <!-- Transaction -->
        <div class="mt-3">
            <label class="form-label">Transaktion</label>
            <select class="form-select" formControlName="tra_id">
                <option *ngFor="let t of (transactions$ | async)" [ngValue]="t.id">
                    {{ t.dsg }}
                </option>
            </select>
        </div>

        <!-- Post -->
        <div class="mt-3">
            <label class="form-label">Post</label>
            <select class="form-select" formControlName="pst_id">
                <option [ngValue]="null">-- wählen --</option>
                <option *ngFor="let p of posts" [ngValue]="p.id">
                    ({{ p.postgroup.dsg }}) - {{ p.dsg }}
                </option>
            </select>
        </div>

        <!-- Betrag -->
        <div class="mt-3">
            <label class="form-label">Betrag</label>
            <input type="number" class="form-control" formControlName="amt" />
        </div>

        <!-- Kommentar -->
        <div class="mt-3">
            <label class="form-label">Kommentar</label>
            <input type="text" class="form-control" formControlName="cmt" />
        </div>

    </div>

    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            Schließen
        </button>
        <button type="submit" class="btn btn-success" [disabled]="form.invalid">
            Speichern
        </button>
    </div>
</form>
