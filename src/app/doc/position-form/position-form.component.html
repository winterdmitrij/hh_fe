<form [formGroup]="form" (ngSubmit)="onSubmit()">
    <!-- Body -->
    <div class="modal-body">
        <!-- Dokument-Id -->
        <div class="mt-3">
            <label for="doc_id" class="form-label">ins Dokument '{{ document?.id }}'</label>
            <input type="hidden" id="doc_id" class="form-control" formControlName="doc_id">
        </div>
        <div *ngIf="form.get('doc_id')?.errors" class="text-danger">
            Falsch
        </div>

        <!-- Position-Id -->
        <div class="mt-3">
            <label for="id" class="form-label">mit dem Position-Id '{{ posId }}'</label>
            <input type="hidden" id="id" class="form-control" formControlName="id">
        </div>
        <div *ngIf="form.get('id')?.errors" class="text-danger">
            Falsch
        </div>

        <!-- Konto -->
        <div class="mt-3">
            <label for="acc_id" class="form-label">Konto</label>
            <select id="acc_id" class="form-select" formControlName="acc_id">
                <option value="" disabled>-- Konto auswählen --</option>
                <option *ngFor="let acc of accounts" [value]="acc.id">{{ acc.dsg }}</option>
            </select>
        </div>
        <div *ngIf="form.get('acc_id')?.errors" class="text-danger">
            Falsch
        </div>

        <!-- Post -->
        <div class="mt-3">
            <label for="pst_id" class="form-label">Post</label>
            <select id="pst_id" class="form-select" formControlName="pst_id">
                <option value="" disabled>-- Post auswählen --</option>
                <option *ngFor="let pst of posts" [value]="pst.id">{{ pst.dsg }}</option>
            </select>
        </div>
        <div *ngIf="form.get('pst_id')?.errors" class="text-danger">
            Falsch
        </div>

        <!-- Betrag -->
        <!-- ToDo: Validator: NotZero -->
        <div class="mt-3">
            <label for="amt" class="form-label">Betrag</label>
            <input id="amt" type="number" class="form-control" formControlName="amt">
        </div>
        <div *ngIf="form.get('amt')?.errors" class="text-danger">
            Falsch
        </div>


        <!-- Kommentar -->
        <div class="mb-3">
            <label for="cmt" class="form-label">Kommentar</label>
            <input id="cmt" class="form-control" formControlName="cmt">
        </div>
        <div *ngIf="form.get('cmt')?.errors" class="text-danger">
            Falsch
        </div>
    </div>

    <!-- Footer -->
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            Schließen
        </button>
        <button type="submit" class="btn btn-success" data-bs-dismiss="modal" [disabled]="form.invalid">
            Speichern
        </button>
    </div>
</form>
