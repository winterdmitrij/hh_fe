<form [formGroup]="form" (ngSubmit)="onSubmit()">
    <!-- Body -->
    <div class="modal-body">
        <!-- Position-Id -->
        <div class="mb-3">
            <label for="id" class="form-label">Position-Id: {{ posId }}</label>
            <input id="id" class="form-control" formControlName="id" [placeholder]="posId">
        </div>

        <!-- Dokument-Id -->
        <div class="mb-3">
            <label for="doc_id" class="form-label">Dokument-Id: {{ document?.id }}</label>
            <input id="doc_id" class="form-control" formControlName="doc_id" [placeholder]="document?.id">
        </div>

        <!-- Konto -->
        <div class="mb-3">
            <label for="acc_id" class="form-label">Konto</label>
            <select id="acc_id" class="form-select" formControlName="acc_id">
                <option value="" disabled>-- Konto auswählen --</option>
                <option *ngFor="let acc of accounts" [value]="acc.id">{{ acc.dsg }}</option>
            </select>
        </div>

        <!-- Post -->
        <div class="mb-3">
            <label for="pst_id" class="form-label">Post</label>
            <select id="pst_id" class="form-select" formControlName="pst_id">
                <option value="" disabled>-- Post auswählen --</option>
                <option *ngFor="let pst of posts" [value]="pst.id">{{ pst.dsg }}</option>
                <!-- ToDo: pstGrp.pst.dsg (pstGrp.dsg) -->
            </select>
        </div>

        <!-- Betrag -->
        <div class="mb-3">
            <label for="amt" class="form-label">Betrag</label>
            <input id="amt" type="number" class="form-control" formControlName="amt">
        </div>


        <!-- Kommentar -->
        <div class="mb-3">
            <label for="cmt" class="form-label">Kommentar</label>
            <input id="cmt" class="form-control" formControlName="cmt">
        </div>
    </div>

    <!-- Footer -->
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            Schließen
        </button>
        <button type="submit" class="btn btn-success" [disabled]="form.invalid">
            Speichern
        </button>
    </div>
</form>
